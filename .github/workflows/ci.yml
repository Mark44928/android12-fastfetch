name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fastfetch (release tarball, no root needed)
        run: |
          # the tarball is rooted at fastfetch-linux-amd64/usr/bin/, so the
          # binary needs three path components stripped to land alone in bin/
          curl -fsSL -o "$RUNNER_TEMP/fastfetch.tar.gz" \
            https://github.com/fastfetch-cli/fastfetch/releases/download/2.71.0/fastfetch-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/fastfetch.tar.gz" -C "$HOME/.local/bin" \
            --strip-components=3 fastfetch-linux-amd64/usr/bin/fastfetch
          chmod +x "$HOME/.local/bin/fastfetch"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Config parses and runs
        run: |
          cp ascii.txt "$HOME/ascii.txt"
          fastfetch -c config.jsonc --pipe
          fastfetch -c presets/minimal.jsonc --pipe
      # The config is Android-shaped (Termux disk folders, dpkg counts), so on
      # a Linux runner the rows must still RENDER — the values themselves
      # differ by platform and are not what this checks.
      - name: Expected rows render
        run: |
          out=$(fastfetch -c config.jsonc --pipe | sed 's/\x1b\[[0-9;]*[A-Za-z]//g')
          # Disk depends on the configured mount points existing (/data and
          # /storage/emulated/0 are Android paths), so it is checked on a
          # device, not here.
          for row in RAM CPU; do
            printf '%s\n' "$out" | grep -q "$row" || { echo "missing $row row"; exit 1; }
          done
          echo "rows OK"
      - name: Installer smoke test
        run: bash tests/install-smoke.sh
