name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fastfetch (release tarball, no root needed)
        run: |
          curl -fsSL -o /tmp/fastfetch.tar.gz \
            https://github.com/fastfetch-cli/fastfetch/releases/download/2.71.0/fastfetch-linux-amd64.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/fastfetch.tar.gz -C "$HOME/.local/bin" fastfetch
          chmod +x "$HOME/.local/bin/fastfetch"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Config parses and runs
        run: |
          cp ascii.txt "$HOME/ascii.txt"
          fastfetch -c config.jsonc --pipe
      - name: Expected rows render
        run: |
          out=$(fastfetch -c config.jsonc --pipe | sed 's/\x1b\[[0-9;]*[A-Za-z]//g')
          printf '%s\n' "$out" | grep -q "RAM" || { echo "missing RAM row"; exit 1; }
          printf '%s\n' "$out" | grep -q "CPU" || { echo "missing CPU row"; exit 1; }
          printf '%s\n' "$out" | grep -q "Disk" || { echo "missing Disk row"; exit 1; }
          printf '%s\n' "$out" | grep -q "ext4\|btrfs\|apfs\|ntfs" || { echo "disk row has no filesystem"; exit 1; }
          echo "rows OK"
